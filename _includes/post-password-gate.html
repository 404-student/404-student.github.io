<section
  class="post-password-gate"
  data-password-gate
  data-password-hash="{{ page.password_hash | downcase | escape }}"
  data-password-key="{{ page.url | default: page.id | escape }}"
  aria-labelledby="post-password-title"
>
  <div class="post-password-gate__icon" aria-hidden="true">
    <i class="fas fa-lock"></i>
  </div>
  <div class="post-password-gate__body">
    <h2 id="post-password-title">这篇文章受到密码保护</h2>
    <p>请输入密码后继续阅读。密码只会在你的浏览器中进行校验。</p>
    {% if page.password_hint %}
      <p class="post-password-gate__hint"><strong>提示：</strong>{{ page.password_hint }}</p>
    {% endif %}

    <form class="post-password-form" data-password-form novalidate>
      <label for="post-password-input">文章密码</label>
      <div class="post-password-form__controls">
        <div class="post-password-form__input-wrap">
          <input
            id="post-password-input"
            name="password"
            type="password"
            autocomplete="current-password"
            spellcheck="false"
            required
            data-password-input
          >
          <button
            class="post-password-form__visibility"
            type="button"
            aria-label="显示密码"
            aria-pressed="false"
            data-password-visibility
          >显示</button>
        </div>
        <button class="post-password-form__submit" type="submit" data-password-submit>解锁文章</button>
      </div>
      <p class="post-password-form__status" role="status" aria-live="polite" data-password-status></p>
    </form>

    <noscript><p class="post-password-form__status is-error">需要启用 JavaScript 才能验证密码。</p></noscript>
  </div>
</section>
